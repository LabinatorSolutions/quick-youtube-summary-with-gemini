<!DOCTYPE html>
<html lang="en">
<head>
  <title>Quick YouTube Summary with Gemini Settings</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      --primary: #0061FF;
      --primary-hover: #0056E0;
      --bg: #F8FAFC;
      --card-bg: rgba(255, 255, 255, 0.8);
      --text: #0F172A;
      --text-muted: #64748B;
      --border: #E2E8F0;
      --input-bg: #FFFFFF;
      --success: #10B981;
      --error: #EF4444;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --primary: #3B82F6;
        --primary-hover: #60A5FA;
        --bg: #0F172A;
        --card-bg: rgba(30, 41, 59, 0.7);
        --text: #F8FAFC;
        --text-muted: #94A3B8;
        --border: #334155;
        --input-bg: #0F172A;
        --success: #10B981;
        --error: #F87171;
      }
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      box-sizing: border-box;
      background-image: 
        radial-gradient(at 0% 0%, hsla(217,100%,50%,0.05) 0px, transparent 50%),
        radial-gradient(at 100% 0%, hsla(217,100%,50%,0.05) 0px, transparent 50%);
    }

    .container {
      width: 100%;
      max-width: 720px;
      animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .header {
      margin-bottom: 32px;
      text-align: center;
    }

    .header h1 {
      font-size: 32px;
      font-weight: 700;
      margin: 0 0 8px 0;
      letter-spacing: -0.025em;
    }

    .header p {
      color: var(--text-muted);
      font-size: 16px;
      margin: 0;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 32px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 10px 10px -5px rgba(0, 0, 0, 0.02);
    }

    .label-group {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    label {
      font-weight: 600;
      font-size: 14px;
      color: var(--text);
    }

    .hint {
      font-size: 12px;
      color: var(--text-muted);
    }

    textarea {
      width: 100%;
      height: 300px;
      min-height: 150px;
      background-color: var(--input-bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 14px;
      line-height: 1.6;
      resize: vertical;
      box-sizing: border-box;
      transition: all 0.2s;
      outline: none;
      margin-bottom: 24px;
    }

    textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
    }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .button-group {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    @media (max-width: 400px) {
      .button-group {
        width: 100%;
      }
      button {
        flex: 1;
      }
    }

    button {
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      border: 1px solid transparent;
    }

    #save {
      background-color: var(--primary);
      color: white;
    }

    #save:hover {
      background-color: var(--primary-hover);
      transform: translateY(-1px);
    }

    #save:active {
      transform: translateY(0);
    }

    #reset {
      background-color: transparent;
      color: var(--text-muted);
      border-color: var(--border);
    }

    #reset:hover {
      background-color: rgba(100, 116, 139, 0.05);
      color: var(--text);
      border-color: var(--text-muted);
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--success);
      font-size: 14px;
      font-weight: 500;
      opacity: 0;
      transform: translateX(-10px);
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      pointer-events: none;
    }

    .status.visible {
      opacity: 1;
      transform: translateX(0);
    }

    .status.error {
      color: var(--error);
    }

    .status.error .status-icon {
      background-color: var(--error);
    }

    .status-icon {
      width: 18px;
      height: 18px;
      background-color: var(--success);
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Gemini Settings</h1>
      <p>Personalize your YouTube summarization experience</p>
    </div>
    
    <div class="card">
      <div class="label-group">
        <label for="prompt">System Prompt</label>
        <span class="hint">Supports Markdown</span>
      </div>
      
      <textarea id="prompt" placeholder="Enter your custom prompt here..."></textarea>
      
      <div class="footer">
        <div id="status" class="status" role="status" aria-live="polite" aria-atomic="true">
          <div class="status-icon">✓</div>
          <span class="status-text">Saved successfully</span>
        </div>
        
        <div class="button-group">
          <button id="reset">Reset Default</button>
          <button id="save">Save Changes</button>
        </div>
      </div>
    </div>
  </div>
  <script src="config.js"></script>
  <script src="options.js"></script>
</body>
</html>
