<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quick YouTube Summary with Gemini</title>
  <style>
    :root {
      --bg: #ffffff;
      --text: #0F172A;
      --text-muted: #64748B;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0F172A;
        --text: #F8FAFC;
        --text-muted: #94A3B8;
      }
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px 20px;
      width: 230px;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    img {
      width: 32px;
      height: 32px;
      flex-shrink: 0;
    }

    p {
      margin: 0;
      font-size: 14px;
      line-height: 1.4;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <img src="icon.svg" alt="">
  <p id="msg">Working…</p>
  <script src="popup.js"></script>
</body>
</html>
